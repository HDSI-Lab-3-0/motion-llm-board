<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OUIJAI Pi Display Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="display">
      <h1>OUIJAI</h1>
      <div class="status" id="status">CALIBRATING...</div>
      <div class="field" id="heard">Heard:<br /><span>—</span></div>
      <div class="response" id="response">Response:<br /><span>—</span></div>
      <div class="board" id="board">Board: —</div>
      <div class="detail" id="detail"></div>
    </main>
    <script>
      const statuses = [
        ['CALIBRATING...', 'Preparing the board and microphone.'],
        ['LISTENING...', 'Listening for your question.'],
        ['RESPONDING...', 'Moving the pointer to the answer.']
      ];
      let statusIndex = 0;
      const status = document.querySelector('#status');
      const detail = document.querySelector('#detail');
      const updateStatus = () => {
        const [label, description] = statuses[statusIndex];
        status.textContent = label;
        detail.textContent = description;
        statusIndex = (statusIndex + 1) % statuses.length;
      };
      updateStatus();
      window.setInterval(updateStatus, 2500);
    </script>
  </body>
</html>
